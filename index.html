<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<title>Pattern Champion</title>
<style>
body{background:black;color:white;font-family:Arial;text-align:center}
button{background:white;color:black;border:none;padding:10px 20px;margin:8px;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<h1>Number Patterns</h1>
<h2 id='levelTitle'></h2>
<h3 id='timer'></h3>
<div id='quiz'></div>
<button id='playAgain' class='hidden' onclick='startGame()'>Play Again</button>

<script>
const levels=[
{title:'Level 1 - Easy',questions:[
{q:'What are the next numbers in this pattern? 1, 3, 6, 10, 15 ____, ____',opts:['21, 28','20, 25','18, 30','22, 27'],a:0},
{q:'What are the next numbers in this pattern? 1, 3, 5, 7, 9, ____, ____',opts:['10,11','11,13','12,14','13,15'],a:1},
{q:'What is the pattern? 2, 4, 6, 8, 10 …..',opts:['Add 1','Add 2','Multiply by 2','Add 3'],a:1},
{q:'Which letter comes next? A, C, E, G, ____, ____',opts:['H,I','I,K','J,L','K,M'],a:1},
{q:'Which letter comes next? V, X, ____',opts:['Y','Z','A','W'],a:1}
]},
{title:'Level 2 - Medium',questions:[
{q:'What is the pattern? 1, 2, 5, 16, 64….',opts:['Add 3','Multiply by increasing numbers and add 1','Square numbers','Add previous two'],a:1},
{q:'Which numbers come next? 1, 4, 10, 20, ___, ___',opts:['30,40','35,56','40,60','36,55'],a:1},
{q:'Which letter comes next? A, E, H, L, ___',opts:['O','P','Q','R'],a:1},
{q:'What is the pattern? A,D,G,J ….',opts:['Skip 1 letter','Skip 2 letters','Skip 3 letters','Reverse alphabet'],a:1},
{q:'What are the next colours in this pattern? Red, Yellow, Green, Blue, Orange, ____, ____',opts:['Pink, Brown','Indigo, Violet','Black, White','Silver, Gold'],a:1}
]},
{title:'Level 3 - Hard',questions:[
{q:'Which number comes next in this pattern? 1, 2, 5, 16, 64….',opts:['128','256','321','325'],a:2},
{q:'What letter comes next in this pattern? A,G,N,___',opts:['T','U','V','W'],a:3},
{q:'What pattern can you see in this triangle?',img:true,opts:['Prime numbers','Each number is sum of two above','Multiples of 2','Squares'],a:1},
{q:'What letters come next? AB, FG, KL, PQ ___, ___',opts:['UV, ZA','ST, XY','WX, BC','QR, UV'],a:0},
{q:'What comes next? 1, 5, 15, 35, ___, ____',opts:['45,55','60,90','70,126','75,140'],a:2}
]}
];

let levelIndex=0,qIndex=0,timeLeft=900,timer;

function shuffle(arr){return arr.sort(()=>Math.random()-0.5)}

function startGame(){levelIndex=0;document.getElementById('playAgain').classList.add('hidden');levels.forEach(l=>shuffle(l.questions));startLevel();}

function startLevel(){qIndex=0;timeLeft=900;document.getElementById('levelTitle').innerText=levels[levelIndex].title;timer=setInterval(updateTimer,1000);showQuestion();}

function updateTimer(){timeLeft--;document.getElementById('timer').innerText='Time: '+Math.floor(timeLeft/60)+':'+(timeLeft%60).toString().padStart(2,'0');if(timeLeft<=0)gameOver();}

function showQuestion(){const q=levels[levelIndex].questions[qIndex];let html='<h2>'+q.q+'</h2>';
if(q.img) html+="<img src='https://upload.wikimedia.org/wikipedia/commons/0/0d/PascalTriangleAnimated2.gif' width='250'><br>";
q.opts.forEach((opt,i)=>{html+=`<button onclick='answer(${i})'>${opt}</button><br>`});
document.getElementById('quiz').innerHTML=html;}

function answer(i){const q=levels[levelIndex].questions[qIndex];if(i!==q.a){gameOver();return;}qIndex++;if(qIndex>=levels[levelIndex].questions.length){levelIndex++;clearInterval(timer);if(levelIndex>=levels.length){winGame();}else startLevel();}else showQuestion();}

function gameOver(){clearInterval(timer);document.getElementById('quiz').innerHTML='<h1>Game Over</h1>';document.getElementById('playAgain').classList.remove('hidden');}
function winGame(){document.getElementById('quiz').innerHTML='<h1>You are the Pattern Champion!</h1>';document.getElementById('playAgain').classList.remove('hidden');}

startGame();
</script>
</body>
</html>
